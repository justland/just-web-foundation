packages:
  - apps/*
  - facades/*
  - libs/*
  - tools/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  fsevents: true
  sharp: true

catalog:
  react: ^18.3.1
  react-dom: ^18.3.1

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

# Supply-chain soak. `minimumReleaseAge` is only honoured as a pnpm setting when it
# comes from here (or config.yaml/CLI/env) - in `.npmrc` it is not a valid key and the
# soak silently runs in loose mode. `minimumReleaseAgeStrict` makes a too-young package
# fail the install instead of being appended to `minimumReleaseAgeExclude` and installed
# anyway. To take something younger than the window, add an exact version below.
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  # type-plus@8.0.0-beta.10 fixes the CJS packaging defect in beta.8 that broke
  # require() of this package. Taken before the 24h soak elapses; it is a
  # first-party dependency published via npm trusted publishing with SLSA
  # provenance (verified). tersify and unpartial are its runtime dependencies at
  # the versions beta.10 requires - same publisher, same provenance - so they are
  # listed here too. Exact versions only; drop these once the soak has elapsed.
  - 'type-plus@8.0.0-beta.10'
  - 'tersify@4.0.6'
  - 'unpartial@1.0.7'
