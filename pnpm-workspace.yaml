packages:
  - apps/*
  - facades/*
  - libs/*
  - tools/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  fsevents: true
  sharp: true

catalog:
  react: ^18.3.1
  react-dom: ^18.3.1

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

# Supply-chain soak. `minimumReleaseAge` is only honoured as a pnpm setting when it
# comes from here (or config.yaml/CLI/env) - in `.npmrc` it is not a valid key and the
# soak silently runs in loose mode. `minimumReleaseAgeStrict` makes a too-young package
# fail the install instead of being appended to `minimumReleaseAgeExclude` and installed
# anyway. To take something younger than the window, add an exact version to a
# `minimumReleaseAgeExclude:` list here, and drop it again once the soak has elapsed.
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
