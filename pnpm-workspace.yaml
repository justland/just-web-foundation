packages:
  - apps/*
  - facades/*
  - libs/*
  - tools/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  fsevents: true
  sharp: true

catalog:
  react: ^18.3.1
  react-dom: ^18.3.1

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'

patchedDependencies:
  storybook-addon-tag-badges: patches/storybook-addon-tag-badges.patch

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

